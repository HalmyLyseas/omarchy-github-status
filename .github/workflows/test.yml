name: test

"on":
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        omarchy: [v4.0.5, v4.5.0]
    env:
      GHS_SHELL_TREE: /tmp/omarchy/shell
      OMARCHY_PLUGIN_VALIDATOR: /tmp/omarchy/bin/omarchy-plugin-validate
    steps:
      # archlinux:latest ships pacman but not git, so install it before
      # checkout can run. Full sync+upgrade, never a bare `-Sy` -- a
      # partial upgrade is Arch's own well-documented way to break a system.
      - name: Install git
        run: pacman -Syu --noconfirm git

      - uses: actions/checkout@v7

      - name: Trust the checkout (container runs as root, workspace is owned by the runner uid)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install test dependencies
        run: |
          # Measured set: quickshell (qs, and pulls in qt6-declarative's
          # qmllint as a side effect) + cage (headless Wayland compositor)
          # run the probe suites; nodejs runs the JS suites; procps-ng
          # provides `ps`; github-cli (from `extra`) runs the version-pin
          # half of the CLI contract test -- CI has no credentials, so its
          # auth half skips itself; jq is what the plugin-validate script
          # needs.
          pacman -Syu --noconfirm quickshell cage nodejs procps-ng jq github-cli

      - name: Clone exact Omarchy source
        run: |
          # Pin the compatibility targets instead of testing whatever the
          # stable package happens to be today.
          git clone --depth 1 --branch "${{ matrix.omarchy }}" https://github.com/basecamp/omarchy.git /tmp/omarchy
          test "$(git -C /tmp/omarchy describe --tags --exact-match)" = "${{ matrix.omarchy }}"
          test -d "$GHS_SHELL_TREE"
          test -x "$OMARCHY_PLUGIN_VALIDATOR"

      - name: qmllint every .qml file (0 errors required, warnings allowed)
        run: |
          mkdir -p /tmp/qmlroot
          ln -sfn "$GHS_SHELL_TREE" /tmp/qmlroot/qs
          status=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            out="$(/usr/lib/qt6/bin/qmllint -I /tmp/qmlroot -I "$GHS_SHELL_TREE" "$f" 2>&1)"
            if grep -q ':[0-9]*:[0-9]*: Error' <<<"$out"; then
              echo "$out"
              status=1
            fi
          done < <(git ls-files -z '*.qml')
          echo "qmllint checked $count files"
          [[ $count -ge 5 ]] || { echo "expected at least 5 .qml files, linted $count" >&2; exit 1; }
          exit $status

      - name: omarchy plugin validate (manifest schema, entry points, no symlinks)
        run: '"$OMARCHY_PLUGIN_VALIDATOR" .'

      - name: Node unit tests (Model.js, QML Text-sink audit, comment hygiene)
        run: node --test test/*.test.js

      - name: Host contract (read-only; pins the scoped facade API)
        run: node test/host-contract.mjs

      - name: CLI contract (read-only; skips cleanly without a real authenticated gh)
        run: node test/cli-contract.mjs

      - name: Headless service/UI probes (cage)
        env:
          WLR_BACKENDS: headless
          WLR_RENDERER: pixman
          WLR_LIBINPUT_NO_DEVICES: "1"
          XDG_RUNTIME_DIR: /tmp/xdg-runtime
          QT_QUICK_BACKEND: software
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          cage -- bash test/probe/run
          cage -- bash test/probe/run-ui
          cage -- bash test/probe/run-scoped-settings

      - name: Bounded paste probe (minimal platform)
        run: bash test/probe/run-paste
